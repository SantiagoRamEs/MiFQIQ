{% extends 'base.html' %}
{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/login.css' %}">{% endblock %}
{% block content %}
<div class="registration-page">
    <section class="registration-card">
        <h2>Revisa tu correo</h2>
        <p class="auth-description">Si existe una cuenta asociada al correo ingresado, recibirás instrucciones para restablecer la contraseña.</p>
        <p class="auth-switch"><a href="{% url 'login' %}">Volver al inicio de sesión</a></p>
    </section>
</div>
{% endblock %}
